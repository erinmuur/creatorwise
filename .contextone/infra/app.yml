version: 1
name: "creatorwise"
description: "creatorwise web app"

services:
  web:
    app:
      build:
        dockerfile: "Dockerfile"
        context: "."
    expose: true
    env:
      DATABASE_URL: "sqlite:////app/data/creatorwise.db"
      # Off since the real creator import began (2026-11-09). Leave it off:
      # seed.py fills an EMPTY database on boot, so a fresh volume would come up
      # holding 14 invented creators instead of nothing.
      SEED_SAMPLE_DATA: "0"
      # Password gate. Without both of these the app refuses to serve anything.
      DASHBOARD_PASSWORD: "${ENV.DASHBOARD_PASSWORD}"
      SECRET_KEY: "${ENV.SECRET_KEY}"
      # The subdomain has its own certificate (since 2026-11-18) and http
      # redirects to https, so the session cookie can be Secure.
      SESSION_COOKIE_SECURE: "1"
      # Bearer token for /api/ingest and /api/scan. Without it both endpoints
      # return 503 and accept nothing.
      INGEST_TOKEN: "${ENV.INGEST_TOKEN}"
      # Bearer token for /api/data/* — tools/push_data.py uploads the database,
      # media and photos with it. Without it those endpoints return 503.
      SYNC_TOKEN: "${ENV.SYNC_TOKEN}"
      # Gmail scanner credentials. Blank until the OAuth client exists, which
      # leaves the scanner dormant rather than failing. See docs/gmail-setup.md.
      GMAIL_CLIENT_ID: "${ENV.GMAIL_CLIENT_ID}"
      GMAIL_CLIENT_SECRET: "${ENV.GMAIL_CLIENT_SECRET}"
      GMAIL_REFRESH_TOKEN: "${ENV.GMAIL_REFRESH_TOKEN}"
    # /healthz answers without a login. python, not curl: the slim image has
    # no curl.
    healthcheck:
      test: "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\""
      interval: 30
      timeout: 5
      retries: 3
    source_mounts:
      - source: "./data"
        target: "/app/data"

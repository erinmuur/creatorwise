version: 1
name: "creatorwise"
description: "creatorwise web app"

services:
  web:
    app:
      build:
        dockerfile: "Dockerfile"
        context: "."
    expose: true
    env:
      DATABASE_URL: "sqlite:////app/data/creatorwise.db"
      # Demo only: fills an EMPTY database with sample data on boot.
      # Set to "0" and wipe the volume once real data is imported.
      SEED_SAMPLE_DATA: "1"
      # Password gate. Without both of these the app refuses to serve anything.
      DASHBOARD_PASSWORD: "${ENV.DASHBOARD_PASSWORD}"
      SECRET_KEY: "${ENV.SECRET_KEY}"
      # Keep at "0" until this subdomain has a working certificate — a Secure
      # cookie is never sent over plain HTTP, so login would fail silently.
      SESSION_COOKIE_SECURE: "0"
      # Bearer token for /api/ingest, used by the daily inbox scan job.
      # Without it that endpoint returns 503 and accepts nothing.
      INGEST_TOKEN: "${ENV.INGEST_TOKEN}"
    source_mounts:
      - source: "./data"
        target: "/app/data"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · creatorwise</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main style="max-width:380px; padding-top: var(--space-64)">
    <div class="panel">
      <h1 class="page-title" style="margin-bottom: var(--space-4)">creatorwise</h1>
      <p class="page-sub" style="margin: 0 0 var(--space-24)">Enter the dashboard password.</p>
      <form method="post">
        <input type="password" name="password" autofocus autocomplete="current-password"
               class="field" placeholder="Password">
        {% if error %}
        <p style="color: var(--feedback-error); font-size:12px; margin: var(--space-12) 0 0">{{ error }}</p>
        {% endif %}
        <button type="submit" class="btn-primary" style="width:100%; margin-top: var(--space-16)">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
